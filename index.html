<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CX Consulting</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #0f2744 0%, #1a4a6e 50%, #0d2137 100%);
      color: #f5f7fa;
      padding: 1.5rem;
    }

    main {
      text-align: center;
      max-width: 36rem;
    }

    h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
    }

    p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #c5d4e3;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>CX Consulting website deployed successfully through CapRover.</p>
  </main>

</html>
